services:
  yabe-db:
    image: postgres:18-alpine
    container_name: yabe-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      YABE_INDEXER_PASSWORD: ${YABE_INDEXER_PASSWORD:?set YABE_INDEXER_PASSWORD in .env}
      YABE_API_PASSWORD: ${YABE_API_PASSWORD:?set YABE_API_PASSWORD in .env}
    volumes:
      - yabe-db-data:/var/lib/postgresql
      - ./packages/db/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # -h 127.0.0.1: during first-time init the image runs a temporary server on the unix
      # socket only; checking over TCP keeps us unhealthy until the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 1m

  yabe-db-migration:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    container_name: yabe-db-migration
    environment:
      DATABASE_URL: postgresql://yabe_indexer:${YABE_INDEXER_PASSWORD:?set YABE_INDEXER_PASSWORD in .env}@yabe-db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
    depends_on:
      yabe-db:
        condition: service_healthy
    restart: "no"

  bitcoind:
    image: bitcoin/bitcoin:31.1
    container_name: bitcoind
    command:
      - -signet
      - -server
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcauth=${BITCOIN_RPC_AUTH:?set BITCOIN_RPC_AUTH in .env (pnpm --filter @yabe/indexer rpcauth)}
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    ports:
      - "127.0.0.1:38332:38332"
    healthcheck:
      test:
        ["CMD", "bitcoin-cli", "-signet", "-datadir=/home/bitcoin/.bitcoin", "getblockchaininfo"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 5m

  yabe-indexer:
    build:
      context: .
      args:
        APP: indexer
    container_name: yabe-indexer
    environment:
      # Built here, not read from .env: the .env URLs point at 127.0.0.1 for host development.
      INDEXER_DATABASE_URL: postgresql://yabe_indexer:${YABE_INDEXER_PASSWORD:?set YABE_INDEXER_PASSWORD in .env}@yabe-db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      INDEXER_BITCOIN_NETWORK: signet
      INDEXER_BITCOIN_RPC_URL: http://bitcoind:38332
      INDEXER_BITCOIN_RPC_USER: ${INDEXER_BITCOIN_RPC_USER:?set INDEXER_BITCOIN_RPC_USER in .env}
      INDEXER_BITCOIN_RPC_PASSWORD: ${INDEXER_BITCOIN_RPC_PASSWORD:?set INDEXER_BITCOIN_RPC_PASSWORD in .env}
      # Optional tuning from .env; the defaults match the indexer's own.
      INDEXER_MAX_REORG_DEPTH: ${INDEXER_MAX_REORG_DEPTH:-100}
      INDEXER_POLL_INTERVAL_MS: ${INDEXER_POLL_INTERVAL_MS:-5000}
      INDEXER_BITCOIN_RPC_TIMEOUT_MS: ${INDEXER_BITCOIN_RPC_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      yabe-db-migration:
        condition: service_completed_successfully
      bitcoind:
        condition: service_healthy
    # Outages of the node or database are waited out in-process, so the indexer only exits on
    # a fatal error (reorg deeper than INDEXER_MAX_REORG_DEPTH, wrong network), which would
    # fail again on every restart: give up after 5 attempts and stay exited for
    # `docker compose logs yabe-indexer`. `docker compose up` resets the count.
    restart: on-failure:5
    # Finishes the current block on SIGTERM; a large block can take a while.
    stop_grace_period: 1m

  yabe-api:
    build:
      context: .
      args:
        APP: api
    container_name: yabe-api
    environment:
      API_DATABASE_URL: postgresql://yabe_api:${YABE_API_PASSWORD:?set YABE_API_PASSWORD in .env}@yabe-db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      yabe-db-migration:
        condition: service_completed_successfully
    healthcheck:
      # The image has no curl; Node's fetch checks /ready (the database answers).
      # No spaces in the script: Podman splits exec-form healthcheck arguments on spaces.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  yabe-db-data:
  bitcoind-data:
