services:
  yabe-db:
    image: postgres:18-alpine
    container_name: yabe-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      YABE_INDEXER_PASSWORD: ${YABE_INDEXER_PASSWORD}
      YABE_API_PASSWORD: ${YABE_API_PASSWORD}
    volumes:
      - yabe-db-data:/var/lib/postgresql
      - ./packages/db/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 1m

  yabe-db-migration:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    container_name: yabe-db-migration
    environment:
      DATABASE_URL: postgresql://yabe_indexer:${YABE_INDEXER_PASSWORD}@yabe-db:5432/${POSTGRES_DB}
    depends_on:
      yabe-db:
        condition: service_healthy
    restart: "no"

volumes:
  yabe-db-data:
