name: E2E

# The whole Compose stack on regtest, driven by Playwright (e2e/). It builds every image and
# runs bitcoind, so it is too slow for every PR: it runs when deploying to production (a push
# to master) or by hand.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium and its system libraries
        run: pnpm --filter @yabe/e2e exec playwright install --with-deps chromium

      - name: Configure the stack from the example environment
        run: cp .env.example .env

      - name: Run the end-to-end suite
        run: pnpm e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
