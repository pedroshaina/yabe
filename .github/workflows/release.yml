name: Release

# A push to master publishes the images to GHCR, but only after CI and the end-to-end suite
# pass on that commit. Every image is tagged with the full commit SHA; the cluster pins them by
# digest (see docs/specs/03-image-publishing.md).
on:
  push:
    branches: [master]

# Releases run one at a time, in merge order; a newer pending release replaces an older
# pending one, so an old build never lands after a new one (homelab ADR-0024).
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  publish:
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      indexer: ${{ steps.indexer.outputs.digest }}
      api: ${{ steps.api.outputs.digest }}
      migration: ${{ steps.migration.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
    env:
      REGISTRY: ghcr.io/pedroshaina
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One after another, so a failure stops before the rest are pushed.
      - name: Build and push yabe-indexer
        id: indexer
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=indexer
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/yabe-indexer:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          push: true

      - name: Build and push yabe-api
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=api
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/yabe-api:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          push: true

      - name: Build and push yabe-db-migration
        id: migration
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/db/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/yabe-db-migration:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          push: true

      - name: Build and push yabe-web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/yabe-web:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          push: true

      - name: List the published references
        if: always()
        env:
          INDEXER: ${{ steps.indexer.outputs.digest }}
          API: ${{ steps.api.outputs.digest }}
          MIGRATION: ${{ steps.migration.outputs.digest }}
          WEB: ${{ steps.web.outputs.digest }}
        run: |
          {
            echo "### Images for ${GITHUB_SHA}"
            echo
            for pair in "yabe-indexer:$INDEXER" "yabe-api:$API" "yabe-db-migration:$MIGRATION" "yabe-web:$WEB"; do
              name=${pair%%:*}; digest=${pair#*:}
              if [ -n "$digest" ]; then
                echo "- \`$REGISTRY/$name:$GITHUB_SHA@$digest\`"
              else
                echo "- $name: **not published**"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Collect the digests
        env:
          INDEXER: ${{ needs.publish.outputs.indexer }}
          API: ${{ needs.publish.outputs.api }}
          MIGRATION: ${{ needs.publish.outputs.migration }}
          WEB: ${{ needs.publish.outputs.web }}
        run: |
          mkdir -p digests
          echo "yabe-indexer=$INDEXER" > digests/yabe-indexer
          echo "yabe-api=$API" > digests/yabe-api
          echo "yabe-db-migration=$MIGRATION" > digests/yabe-db-migration
          echo "yabe-web=$WEB" > digests/yabe-web
      - name: Install kustomize v5.8.1 (checksum-pinned; the version Argo CD bundles)
        run: |
          f=kustomize_v5.8.1_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/$f"
          echo "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d  $f" | sha256sum -c -
          tar xzf "$f" kustomize && sudo install -m 0755 kustomize /usr/local/bin/
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOMELAB_APPS_CLIENT_ID }}
          private-key: ${{ secrets.HOMELAB_APPS_PRIVATE_KEY }}
          owner: pedroshaina
          repositories: homelab-apps-gitops
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pedroshaina/homelab-apps-gitops
          ref: main
          token: ${{ steps.token.outputs.token }}
          path: gitops
      - name: Pin the images
        working-directory: gitops
        run: |
          k="apps/$APP/kustomization.yaml"
          [ -f "$k" ] || { echo "::error::$k is missing in homelab-apps-gitops"; exit 1; }
          refs=()
          while IFS='=' read -r name digest; do
            refs+=("$REGISTRY/$name:$GITHUB_SHA@$digest")
          done < <(cat ../digests/*)
          [ "${#refs[@]}" -gt 0 ] || { echo "::error::no image digests to release"; exit 1; }
          for ref in "${refs[@]}"; do (cd "apps/$APP" && kustomize edit set image "$ref"); done
          # kustomize edit adds an entry even if no manifest uses that image: check the render.
          out="$(kustomize build "apps/$APP")"
          for ref in "${refs[@]}"; do
            grep -qF "image: $ref" <<<"$out" || { echo "::error::no manifest in apps/$APP uses ${ref%%:*}"; exit 1; }
          done
          changed="$(git status --porcelain)"
          if [ -n "$changed" ] && [ "$changed" != " M $k" ]; then
            echo "::error::unexpected changes: $changed"; exit 1
          fi
      - name: Commit and push
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already released: nothing to commit." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
          git commit -qam "release($APP): ${GITHUB_SHA::7}" -m "Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          # Another app's release may land first: rebase onto it and retry. Never force-push.
          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then
              echo "Released: https://github.com/pedroshaina/homelab-apps-gitops/commit/$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 5))
            git pull -q --rebase origin main
          done
          echo "::error::push to homelab-apps-gitops main rejected 3 times"; exit 1
    env:
      APP: yabe
      REGISTRY: ghcr.io/pedroshaina
